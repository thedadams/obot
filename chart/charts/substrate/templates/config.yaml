{{- $_ := required "substrate.image.repository is required; build upstream images with tools/build-substrate-images.sh" .Values.image.repository -}}
{{- if not (has .Values.storage.backend (list "s3" "gcs")) -}}
{{- fail "substrate.storage.backend must be s3 or gcs" -}}
{{- end }}
{{- if and .Values.storage.existingSecret .Values.storage.credentials }}
{{- fail "use either substrate.storage.existingSecret or substrate.storage.credentials" }}
{{- end }}
{{- if .Values.storage.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: substrate-storage-credentials
  namespace: ate-system
type: Opaque
stringData:
  {{- range $key, $value := .Values.storage.credentials }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: substrate-storage
  namespace: ate-system
data:
  {{- toYaml .Values.storage.env | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
  namespace: ate-system
data:
  ATE_API_POSTGRES_SCHEMA: public
  {{- if not .Values.postgres.dsn }}
  ATE_API_POSTGRES_CONNECTION_STRING: postgresql://postgres@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/podidentity.podcert.ate.dev/credential-bundle.pem&sslkey=/run/podidentity.podcert.ate.dev/credential-bundle.pem
  {{- end }}
{{- if .Values.postgres.dsn }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ate-system
type: Opaque
stringData:
  ATE_API_POSTGRES_CONNECTION_STRING: {{ .Values.postgres.dsn | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | default "http://localhost:4317" | quote }}
  OTEL_LOGS_EXPORTER: none
